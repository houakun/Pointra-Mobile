[package]
name = "pointra_mobile"
version = "0.4.2"
edition = "2021"
description = "Pointra Mobile — Android 端数据层、简化 SM-2 与局域网同步客户端"

[lib]
name = "pointra_mobile"
crate-type = ["lib", "staticlib", "cdylib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri v2 移动端壳
tauri = { version = "2", features = [] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 局域网同步走明文 HTTP，本来不需要 TLS；但「不依赖电脑端的在线更新」
# 要访问 GitHub Releases（只有 https），所以启用 rustls。
#
# 【坑】不要用 reqwest 的 `rustls` feature：它在 Android 上走「平台证书验证器」
# （rustls-platform-verifier），需要显式初始化，否则第一次 HTTPS 请求会在 tokio
# 工作线程上 panic（“Expect rustls-platform-verifier to be initialized”），
# 表现为界面无限转圈。这里用 `rustls-no-provider` + **编译期嵌入的根证书**
# （webpki-roots），行为完全确定，不依赖运行时初始化。
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
# WebSocket 客户端（明文 ws://，默认特性即可）
tokio-tungstenite = "0.26"
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

# 自更新最后一步：把下载好的 APK 交给系统安装器。
# 走 JNI 直接调自己写的 Kotlin 助手（ApkInstaller），
# 而不是 tauri-plugin-opener —— 后者的 openPath/openUrl 在 Android 上会被 ACL 拦
# （plugin:opener|open_url not allowed by ACL），JNI 这条路根本不经过 ACL。
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[profile.release]
# 手机安装包体积敏感：debug 包 163MB，加上这些后 release 通常只剩十几 MB。
# strip 同时会去掉符号表（崩溃栈会不好看，个人自用可接受）。
opt-level = "s"
lto = true
codegen-units = 1
strip = true
